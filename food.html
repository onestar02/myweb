<body>
    <div class="main">
        <div class="home" onclick="final_project()"></div>
        <div class="out" onclick="mainPage()"></div>
        <div class="food"></div>
        <div class="bar"></div>
        <div class="korea" onclick="koreaPage()"></div>
        <div class="japan" onclick="japanPage()"></div>
        <div class="china"></div>
        <div class="western"></div>
        <div class="left" onclick= "prevFood()"></div>
        <div class="box" id="foodbox"></div>
        <div class="right" onclick= "nextFood()"></div>
        <div class="start_button" onclick= "openTimer()"></div>
        <div class="footer">
        오늘 완료한 집중 횟수 | <span id="timerCount">0</span>회
        &nbsp;&nbsp;&nbsp;
        © Study Time
        </div>     
    </div>
        
    <script>
        function final_project(){
            location.href = "final_project.html";
        }
        function mainPage(){
            location.href = "main.html";
        }
        function koreaPage(){
            location.href = "korea.html";
        }
        function japanPage(){
            location.href = "japan.html";
        }
        function timerPage(){
            location.href = "timer.html";
        }
        function openTimer() {
        const width = 472;
        const height = 682;

        const left = (screen.width - width) / 2;
        const top = (screen.height - height) / 2;

        window.open(
            "timer.html",
            "timerWindow",
            `width=${width},height=${height},left=${left},top=${top},resizable=no,scrollbars=no`
        );
    }
        const foodImages = [
            "sandwich.png",
            "food_box.png",
            "pizza.png"
        ];

        let currentFood = 1;

        function showFood() {
            document.getElementById("foodbox").style.backgroundImage =
            `url("${foodImages[currentFood]}")`;
        }

        function prevFood() {
        currentFood--;

            if (currentFood < 0) {
            currentFood = foodImages.length - 1;
            }

            showFood();
        }

        function nextFood() {
            currentFood++;

            if (currentFood >= foodImages.length) {
            currentFood = 0;
            }

            showFood();
        }

        function showTimerCount() {
            const count = sessionStorage.getItem("timerCount") || 0;
            const timerCount = document.getElementById("timerCount");

            if (timerCount) {
                timerCount.textContent = count;
            }
        }

        window.showTimerCount = showTimerCount;

        window.addEventListener("pageshow", showTimerCount);
        window.addEventListener("focus", showTimerCount);

        showTimerCount();
    </script>
</body>
